<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语学习 · 课程目录</title><style>body{font-family:-apple-system,sans-serif;max-width:760px;margin:0 auto;padding:36px 20px;line-height:1.6;background:#fafafa;color:#222}h1{font-size:28px;margin-bottom:4px}.sub{color:#666;margin-bottom:28px}.course-card{display:block;margin:18px 0;padding:24px;border-radius:16px;background:#fff;border:1px solid #e3e3e3;text-decoration:none;color:#222}.course-card:hover{background:#f0f7ff}.course-card h2{margin:0 0 4px;font-size:21px;color:#163e33}.course-card p{margin:0 0 10px;color:#666;font-size:14px}.progress-row{display:flex;gap:8px;align-items:center;font-size:13px;color:#444}.bar{flex:1;height:8px;border-radius:4px;background:#e7ece9;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2d6b55,#3f9c74)}.continue{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:999px;background:#163e33;color:#fff;font-size:13px;text-decoration:none}.continue:hover{background:#2d6b55}.vocab-link{color:#2d6b55;font-size:13px;text-decoration:none}</style></head><body><h1>英语学习 · 课程目录</h1><p class="sub">Immersion Reader · 多课程学习门户 · 学习进度保存在本机浏览器</p><div id="catalog"></div><script>window.__COURSES__ = [{"id": "speaking-vocab", "title": "365 天词汇口语课", "subtitle": "词汇是主线 · Alex 的年度成长故事 · 从入门短句到专业场景", "vocab_title": "365 天专业英语词汇强化", "days": 365, "built_days": 365, "last_day": 365, "url": "courses/speaking-vocab/"}];</script><script>
(function() {
  var esc = function(t) { return String(t || "").replace(/[&<>"]/g, function(c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var el = document.getElementById("catalog");
  el.innerHTML = (window.__COURSES__ || []).map(function(c) {
    var visited = 0, lastDay = 0;
    try {
      var p = JSON.parse(localStorage.getItem("ir:" + c.id + ":progress") || "null");
      if (p && p.visited) visited = Object.keys(p.visited).length;
      if (p && p.lastDay) lastDay = p.lastDay;
    } catch (e) {}
    var pct = Math.min(100, Math.round(visited / c.days * 100));
    var continueHref = lastDay ? c.url + "day-" + String(lastDay).padStart(3, "0") + "/index.html" : c.url + "day-001/index.html";
    var continueLabel = visited ? "继续学习 · Day " + lastDay : "从 Day 1 开始";
    return '<a class="course-card" href="' + esc(c.url) + 'index.html">'
      + '<h2>' + esc(c.title) + '</h2>'
      + '<p>' + esc(c.subtitle) + '</p>'
      + '<div class="progress-row"><span>' + visited + ' / ' + c.days + ' 天</span>'
      + '<span class="bar"><i style="width:' + pct + '%"></i></span><span>' + pct + '%</span></div>'
      + '<span class="continue">' + continueLabel + ' →</span>'
      + ' <span class="vocab-link" style="margin-left:10px">' + esc(c.vocab_title) + ' →</span>'
      + '</a>';
  }).join("") || '<p>还没有已构建的课程。</p>';
})();
</script></body></html>
